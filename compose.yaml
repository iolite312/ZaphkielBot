x-storage: &storage
  FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
  # Azurite's well-known development account (public, not a secret), pointed at the azurite container.
  AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite-data:/data

  zaphkielbot:
    image: zaphkielbot
    build:
      context: .
      dockerfile: ZaphkielBot/Dockerfile
    environment:
      <<: *storage
      AzureFunctionsWebHost_hostid: zaphkielbot
      Discord__PublicKey: ${Discord_PublicKey:-}
      Discord__BotToken: ${Discord_BotToken:-}
      Discord__IncidentChannelId: ${Discord_IncidentChannelId:-}
      Discord__GuildId: ${Discord_GuildId:-}
      GitHub__WebhookSecret: ${GitHub_WebhookSecret:-}
    ports:
      - "7071:80" # POST /api/discord/interactions and POST /api/github/webhook
    depends_on:
      - azurite

  # Processing side: queue processors and the analytics endpoints. Needs no public URL.
  zaphkielprocessor:
    image: zaphkielprocessor
    build:
      context: .
      dockerfile: ZaphkielProcessor/Dockerfile
    environment:
      <<: *storage
      AzureFunctionsWebHost_hostid: zaphkielprocessor
      GitHub__Token: ${GitHub_Token:-}
      GitHub__Owner: ${GitHub_Owner:-}
      GitHub__Repository: ${GitHub_Repository:-}
    ports:
      - "7072:80"
    depends_on:
      - azurite

volumes:
  azurite-data:
